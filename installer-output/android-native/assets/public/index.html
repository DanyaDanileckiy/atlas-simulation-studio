        }

            font-size: 14px;
            font-weight: 600;
            fill: #f8fafc;

        }
        .bar-value {
            font-size: 14px;
            font-weight: 600;
            fill: #94a3b8;
            alignment-baseline: middle;
        }
        .trend-text {
            font-size: 11px;
            font-weight: 600;
            alignment-baseline: middle;
        }
        .density-text {
            font-size: 12px;
            font-weight: 400;
            fill: #64748b;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {

        }
        ::-webkit-scrollbar-thumb {

            border-radius: 4px;
        }
        .tab-btn.active {
            border-bottom: 2px solid #3b82f6;

        }
        select option {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        /* Custom Checkbox */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }

            background-color: #3b82f6;

<body class="h-screen flex flex-col overflow-hidden">

    <div class="studio-strip">
        <div><span class="studio-brand">ATLAS</span> <span data-i18n="studio">SIMULATION STUDIO</span></div>
        <div class="flex items-center gap-2">
            <label for="language-select" data-i18n="language">Язык</label>
            <select id="language-select" class="studio-control" aria-label="Language"></select>
            <button id="install-app" type="button" data-i18n="install">Установить</button>
        </div>
    </div>

    <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-col md:flex-row justify-between items-center gap-4 z-30 shadow-lg shrink-0 relative">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                🌍 <input id="project-name" type="text" maxlength="48" value="Демографическая гонка" aria-label="Название проекта">
            </h1>
            <p id="project-subtitle" class="text-xs text-slate-400 mt-1">Проектирование населения, прироста и плотности</p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-700">
                <span class="text-slate-400 text-xs" data-i18n="subject">Предмет</span>
                <select id="subject-quick" class="bg-transparent text-white text-sm focus:outline-none w-32 cursor-pointer"><option value="demography">Демография</option><option value="gdp">ВВП</option><option value="production">Производство</option><option value="migration">Миграция</option><option value="crime">Преступность</option><option value="custom">Своя метрика</option></select>
            </div>
            <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" />
                </svg>
                <select id="group-filter" class="bg-transparent text-white text-sm font-medium focus:outline-none w-48 cursor-pointer">
                    <option value="all">🌍 Все регионы</option>
                    <optgroup label="Континенты">
                        <option value="Азия">Азия</option>
                        <option value="Европа">Европа</option>
                        <option value="Африка">Африка</option>
                        <option value="Северная Америка">Северная Америка</option>
                        <option value="Южная Америка">Южная Америка</option>
                        <option value="Океания">Океания</option>
                    </optgroup>
                </select>
            </div>
            
            <button id="btn-settings" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg font-medium shadow transition-colors text-sm flex items-center gap-2 border border-slate-600 relative">
                ⚙️ Настройки
            </button>
            
            <!-- Выпадающее меню настроек -->
            <div id="settings-panel" class="hidden absolute top-full right-4 mt-2 w-72 bg-slate-800 border border-slate-600 rounded-lg shadow-2xl z-50 p-4 flex flex-col gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Метрика гонки</label>
                    <select id="metric-select" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white focus:outline-none">
                        <option value="population">По общему населению</option>
                        <option value="growth_abs">По абсолютному приросту (чел/год)</option>
                        <option value="density">По плотности (чел/км²)</option>
                        <option value="gdp">ВВП (демо-индекс)</option>
                        <option value="production">Производство (демо-индекс)</option>
                        <option value="migration">Миграционный баланс (демо-индекс)</option>
                        <option value="crime">Уровень преступности (демо-индекс)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1" data-i18n="simulation">Что симулируем</label>
                    <select id="simulation-select" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white focus:outline-none">
                        <option value="demography">Демография</option><option value="gdp">ВВП</option><option value="production">Производство</option><option value="migration">Мигранты</option><option value="crime">Преступность</option><option value="custom">Своя метрика</option>
                    </select>
                </div>
                <div id="custom-metric-wrap" class="hidden">
                    <label class="block text-xs text-slate-400 mb-1" data-i18n="customMetric">Название своей метрики</label>
                    <input id="custom-metric" maxlength="30" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white" placeholder="Например: уровень образования">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Показывать участников</label>
                    <select id="top-n-select" class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-white focus:outline-none">
                        <option value="10">Топ-10</option>
                        <option value="20">Топ-20</option>
                        <option value="50">Топ-50</option>
                        <option value="100">Топ-100</option>
                        <option value="150" selected>Все 150</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm text-slate-300">Автомасштаб оси X</label>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="auto-zoom" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-600 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                        <label for="auto-zoom" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-600 cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-sm text-slate-300">Звук при обгонах 🔊</label>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="sound-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-slate-600 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                        <label for="sound-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-600 cursor-pointer"></label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col relative overflow-hidden min-h-0">
        
        <div class="flex border-b border-slate-700 px-6 bg-slate-800/50 shrink-0">
            <button id="tab-countries" class="tab-btn active px-4 py-3 font-medium text-sm transition-colors">Гонка: Страны</button>
            <button id="tab-cities" class="tab-btn px-4 py-3 font-medium text-slate-400 hover:text-slate-200 transition-colors">Гонка: Города</button>
            <button id="tab-data-countries" class="tab-btn px-4 py-3 font-medium text-slate-400 hover:text-slate-200 transition-colors">Редактор: Страны</button>
            <button id="tab-data-cities" class="tab-btn px-4 py-3 font-medium text-slate-400 hover:text-slate-200 transition-colors">Редактор: Города</button>
        </div>

        <div id="timeline-container" class="px-4 py-3 bg-slate-800/80 backdrop-blur border-b border-slate-700 flex flex-wrap items-center gap-4 shrink-0 z-20 shadow-sm">

                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                </button>
                <button id="btn-reset" class="hover:bg-slate-600 bg-slate-700 text-slate-200 p-2 rounded-md transition-colors w-10 h-10 flex justify-center items-center shadow-md" title="Сбросить на начало">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                </button>

        </div>

                <div id="chart-container" class="w-full flex-1 overflow-y-auto overflow-x-hidden relative z-10 scroll-smooth"></div>
            </div>

        </div>

                <div class="flex flex-wrap gap-2 items-center">
                    <button id="btn-clear-all" class="bg-red-700 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-medium shadow transition-colors flex items-center gap-1 text-sm" title="Обнулить население">

                    <button id="btn-add-row" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg font-medium shadow transition-colors text-sm">
                        + Добавить строку
                    </button>
                    <button id="btn-smooth-data" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-medium shadow transition-colors text-sm flex items-center gap-1" title="Убрать резкие скачки в данных">
                        ✨ Сгладить данные
                    </button>
                    
                    <div class="flex items-center gap-1 bg-indigo-900/50 rounded-lg p-1 border border-indigo-700/50 ml-2">

                            <option value="boom">Бэби-бум</option>
                            <option value="stagnation">Стагнация</option>

                    </div>

                </div>
            </div>
            
            <div class="flex-1 w-full bg-slate-800 rounded-lg border border-slate-700 overflow-auto shadow-inner relative scroll-smooth" id="table-scroll-container">

                        <tr id="table-header-row"></tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    function formatNumberSpaces(val) {
        if (val === undefined || val === null || val === "") return "";
        let str = val.toString().replace(/\D/g, ''); 
        if (str === "") return "";
        return str.replace(/\B(?=(\d{3})+(?!\d))/g, " "); 
    }

    // Линейная интерполяция (используется только для нормализации сетки данных при загрузке)
    function getLinearInterpolatedValue(dataObj, targetYear) {
        const years = Object.keys(dataObj).filter(y => y !== "null" && !isNaN(y)).map(Number).sort((a,b)=>a-b);
        if (years.length === 0) return 0;
        if (targetYear <= years[0]) return dataObj[years[0]];
        if (targetYear >= years[years.length-1]) return dataObj[years[years.length-1]];
        let y1, y2;
        for (let i = 0; i < years.length - 1; i++) {
            if (targetYear >= years[i] && targetYear <= years[i+1]) { y1 = years[i]; y2 = years[i+1]; break; }
        }
        return dataObj[y1] + (dataObj[y2] - dataObj[y1]) * ((targetYear - y1) / (y2 - y1));
    }

    // Плавная интерполяция кубическим сплайном Эрмита (для населения)
    function getInterpolatedValueSmooth(cItem, targetYear) {
        let years = cItem.years;
        let growths = cItem.growths;
        let data = cItem.data;
        
        if (!years || years.length === 0) return 0;
        if (targetYear <= years[0]) return data[years[0]];
        if (targetYear >= years[years.length-1]) return data[years[years.length-1]];
        
        let y0, y1;
        for (let i = 0; i < years.length - 1; i++) {
            if (targetYear >= years[i] && targetYear <= years[i+1]) { 
                y0 = years[i]; 
                y1 = years[i+1]; 
                break; 
            }
        }
        
        let p0 = data[y0];
        let p1 = data[y1];
        let dx = y1 - y0;
        let m0 = growths[y0] * dx;
        let m1 = growths[y1] * dx;
        
        let t = (targetYear - y0) / dx;
        let t2 = t * t;
        let t3 = t2 * t;
        
        let h00 = 2*t3 - 3*t2 + 1;
        let h10 = t3 - 2*t2 + t;
        let h01 = -2*t3 + 3*t2;
        let h11 = t3 - t2;
        
        return h00*p0 + h10*m0 + h01*p1 + h11*m1;
    }

    // Точная математическая производная сплайна (Мгновенная скорость прироста в год)
    function getDerivativeValueSmooth(cItem, targetYear) {
        let years = cItem.years;
        let growths = cItem.growths;
        let data = cItem.data;
        
        if (!years || years.length === 0) return 0;
        if (targetYear <= years[0]) return growths[years[0]];
        if (targetYear >= years[years.length-1]) return growths[years[years.length-1]];
        
        let y0, y1;
        for (let i = 0; i < years.length - 1; i++) {
            if (targetYear >= years[i] && targetYear <= years[i+1]) { 
                y0 = years[i]; 
                y1 = years[i+1]; 
                break; 
            }
        }
        
        let p0 = data[y0];
        let p1 = data[y1];
        let dx = y1 - y0;
        let m0 = growths[y0] * dx;
        let m1 = growths[y1] * dx;
        
        let t = (targetYear - y0) / dx;
        let t2 = t * t;
        
        // Производные базисных функций Эрмита
        let dh00 = 6*t2 - 6*t;
        let dh10 = 3*t2 - 4*t + 1;
        let dh01 = -6*t2 + 6*t;
        let dh11 = 3*t2 - 2*t;
        
        let dp_dt = dh00*p0 + dh10*m0 + dh01*p1 + dh11*m1;
        
        // Делим на dx, так как мы дифференцируем по t, а не по году (Chain rule)
        return dp_dt / dx;
    }

    // Экстраполяция исторических данных от 1950 к 1900 году
    function backfillTo1900(dataset) {
        dataset.forEach(item => {
            let p50 = item.data["1950"];
            let p60 = item.data["1960"];
            if (p50 && p60) {
                let rate = p60 / p50;
                rate = 1 + (rate - 1) * 0.6; 
                if(rate < 1.05) rate = 1.05;
                if(rate > 1.25) rate = 1.25;
                
                item.data["1940"] = Math.floor(p50 / rate);
                item.data["1930"] = Math.floor(item.data["1940"] / rate);
                item.data["1920"] = Math.floor(item.data["1930"] / rate);
                item.data["1910"] = Math.floor(item.data["1920"] / rate);
                item.data["1900"] = Math.floor(item.data["1910"] / rate);
            }
        });
    }

    const standardDecades = [1900, 1910, 1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020, 2030, 2040, 2050, 2060, 2070, 2080, 2090, 2100];

            let cityName = cityObj.name;
            let pop2020 = cityObj.pop2020;
            let m2030 = 1.1, m2050 = 1.3, m2075 = 1.4, m2100 = 1.35;
            let cData = {};
            
            [1900, 1910, 1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(y => {
                let progress = (y - 1900) / (2020 - 1900);
                cData[y] = Math.floor((pop2020 * 0.05) * Math.pow((pop2020 / (pop2020 * 0.05)), progress));

            cData[2020] = pop2020;
            cData[2030] = Math.floor(pop2020 * m2030);
            cData[2050] = Math.floor(pop2020 * m2050);
            cData[2075] = Math.floor(pop2020 * m2075);
            cData[2100] = Math.floor(pop2020 * m2100);

            });
            existingCities.add(cityName);
        }
    }

        document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(dict[key])el.textContent=dict[key]});
        document.title=`${document.getElementById('project-name').value} — Atlas Studio`;
        const language=document.getElementById('language-select'); if(language) language.value=lang;
        const settingLabel=document.querySelector('#btn-settings');if(settingLabel)settingLabel.lastChild.textContent=' '+dict.settings;
        const subtitle=document.getElementById('project-subtitle');if(subtitle&&projectSettings.subject!=='demography')subtitle.textContent=dict.description;
    }

    let audioCtx = null;
    let globalMaxPop = 0; 
    let globalMaxDensity = 0;
    let globalMaxGrowth = 0;

    const margin = { top: 10, right: 180, bottom: 20, left: 180 };
    const BAR_HEIGHT = 45;
    let width = 0;
    let svg, chartGroup, axisSvg;
    let xScale, yScale;
    let totalHeight = 0;
    
    let lastTime = 0;
    let animationFrameId = null;
    let currentMaxX = 0; 

    /* =========================================
       ЗВУКОВЫЕ ЭФФЕКТЫ
       ========================================= */
    function playBeep(freq) {
        if (!state.soundEnabled) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    /* =========================================
       D3 ЛОГИКА ОТРИСОВКИ И АНИМАЦИИ
       ========================================= */

    function initD3() {
        const container = document.getElementById("chart-container");
        width = container.clientWidth;
        
        let displayCount = Math.min(state.topN, currentData.length);
        totalHeight = displayCount * BAR_HEIGHT + margin.bottom;

        d3.select("#axis-container").selectAll("*").remove();
        d3.select("#chart-container").selectAll("svg").remove();

        axisSvg = d3.select("#axis-container")
            .append("svg")
            .attr("width", "100%")
            .attr("height", 40);

        axisSvg.append("g")
            .attr("transform", `translate(${margin.left}, 39)`)
            .attr("id", "x-axis")
            .attr("class", "text-slate-500 font-mono text-xs");

        svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", "100%")
            .attr("height", Math.max(container.clientHeight, totalHeight));

        chartGroup = svg.append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

        chartGroup.append("g").attr("id", "grid-lines");

        xScale = d3.scaleLinear().range([0, width - margin.left - margin.right]);

        yScale = d3.scaleBand()
            .domain(d3.range(displayCount))
            .range([0, totalHeight - margin.bottom])
            .padding(0.15); 
    }

    function calculateGlobalMax(rawData) {
        globalMaxPop = 0;
        globalMaxDensity = 0;
        globalMaxGrowth = 0;
        
        rawData.forEach(item => {
            let years = Object.keys(item.data).filter(y => y !== "null" && !isNaN(y)).map(Number).sort((a,b)=>a-b);
            years.forEach((y, i) => {
                let val = item.data[y];
                if(val > globalMaxPop) globalMaxPop = val;
                
                if(item.area) {
                    let d = val / item.area;
                    if(d > globalMaxDensity) globalMaxDensity = d;
                }
                
                if(i < years.length - 1) {
                    let nextY = years[i+1];
                    let growth = (item.data[nextY] - val) / (nextY - y);
                    if(growth > globalMaxGrowth) globalMaxGrowth = growth;
                }
            });
        });
        
        if(globalMaxGrowth < 1000) globalMaxGrowth = 1000000; 
    }

    function loadData(rawData, keepYear = false) {
        calculateGlobalMax(rawData);
        
        let allYears = new Set();
        rawData.forEach(item => {
            Object.keys(item.data).forEach(y => {
                if (y !== "null" && !isNaN(y)) allYears.add(parseFloat(y));
            });
        });
        const yearsArray = Array.from(allYears).sort((a,b) => a - b);
        state.minYear = yearsArray[0] || 1900;
        state.maxYear = yearsArray[yearsArray.length - 1] || 2100;
        
        if (!keepYear) {
            state.currentYear = state.minYear;
        } else {
            if (state.currentYear < state.minYear) state.currentYear = state.minYear;
            if (state.currentYear > state.maxYear) state.currentYear = state.maxYear;
        }
        
        state.selectedBar = null;
        
        const slider = document.getElementById("year-slider");
        slider.min = state.minYear;
        slider.max = state.maxYear;
        slider.value = state.currentYear;
        
        const maxLabel = document.getElementById("max-year-label");
        if (maxLabel) maxLabel.innerText = state.maxYear;

        // Предрасчет касательных (производных) для сплайна с защитой от перекручиваний (Fritsch-Carlson)
        currentData = rawData.map(c => {
            let years = Object.keys(c.data).filter(y => y !== "null" && !isNaN(y)).map(Number).sort((a,b)=>a-b);
            let growths = {};
            
            years.forEach((y, i) => {
                let gPrev = null, gNext = null;
                if (i > 0) gPrev = (c.data[y] - c.data[years[i-1]]) / (y - years[i-1]);
                if (i < years.length - 1) gNext = (c.data[years[i+1]] - c.data[y]) / (years[i+1] - y);
                
                if (gPrev !== null && gNext !== null) {
                    if (gPrev * gNext <= 0) {
                        growths[y] = 0; // Строгая монотонность: если тренд меняется, производная = 0
                    } else {
                        let m = (gPrev + gNext) / 2;
                        let maxM = 3 * Math.min(Math.abs(gPrev), Math.abs(gNext));
                        growths[y] = Math.sign(m) * Math.min(Math.abs(m), maxM);
                    }
                } else if (gPrev !== null) growths[y] = gPrev;
                else if (gNext !== null) growths[y] = gNext;
                else growths[y] = 0;
            });

            return {
                name: c.name,
                flag: c.flag || "",
                color: c.color || "#888",
                area: c.area || 1, 
                data: c.data,
                years: years,
                growths: growths,
                currentValue: 0,
                currentY: 10000, 
                currentOpacity: 0,
                prevRank: 999
            };
        });

        currentMaxX = 0;
        
        initD3();
        chartGroup.selectAll(".bar-group").remove();
        
        const bars = chartGroup.selectAll(".bar-group")
            .data(currentData, d => d.name)
            .enter()
            .append("g")
            .attr("class", "bar-group cursor-pointer transition-colors hover:brightness-110") 
            .attr("transform", d => `translate(0, ${d.currentY})`)
            .on("click", (event, d) => {
                state.selectedBar = state.selectedBar === d.name ? null : d.name;
                if (!state.isPlaying) renderFrame(true); 
            });

        bars.append("rect")
            .attr("class", "bar-rect")
            .attr("height", yScale.bandwidth())
            .attr("fill", d => d.color)
            .attr("rx", 4); 

        bars.append("text")
            .attr("class", "bar-label")
            .attr("x", -10)
            .attr("y", yScale.bandwidth() / 2)
            .text(d => `${d.flag} ${d.name}`);

        bars.append("text")
            .attr("class", "bar-value")
            .attr("x", 10)
            .attr("y", yScale.bandwidth() / 2);

        bars.append("text")
            .attr("class", "trend-text")
            .attr("y", yScale.bandwidth() / 2);

        bars.append("text")
            .attr("class", "density-text hidden md:block")
            .attr("y", yScale.bandwidth() / 2);

        renderFrame(true);
    }

    const formatNumberDisplay = d3.format(",.0f");
    
    function formatPop(num) {
        if(state.metric === 'density') return formatNumberDisplay(num).replace(/,/g, ' ') + ' чел/км²';
        if(state.metric === 'growth_abs') {
            let sign = num > 0 ? "+" : "";
            return sign + formatNumberDisplay(num).replace(/,/g, ' ') + ' в год';
        }
        return formatNumberDisplay(num).replace(/,/g, ' ');
    }
    
    function formatDiff(num) {
        if(num === 0) return { text: "", color: "transparent" };
        let sign = num > 0 ? "↑ +" : "↓ ";
        let color = num > 0 ? "#22c55e" : "#ef4444";
        let abs = Math.abs(num);
        let text = "";
        if(state.metric === 'density') {
            text = abs.toFixed(1);
        } else {
            if(abs >= 1000000) text = (abs / 1000000).toFixed(1) + "М";
            else if (abs >= 1000) text = (abs / 1000).toFixed(0) + "К";
            else text = Math.floor(abs);
        }
        return { text: sign + text, color: color };
    }

    function gameLoop(time) {
        if (!state.isPlaying) return;
        const dt = time - lastTime;
        lastTime = time;

        state.currentYear += dt / state.msPerYear;
        
        if (state.currentYear >= state.maxYear) {
            state.currentYear = state.maxYear;
            document.getElementById("btn-play").click(); 
        }

        document.getElementById("year-slider").value = state.currentYear;
        renderFrame(false, dt);
        
        if (state.isPlaying) animationFrameId = requestAnimationFrame(gameLoop);
    }

    function renderFrame(isInstant = false, dt = 16) {
        let currentTotalPop = 0;
        let currentTotalArea = 0;

        currentData.forEach(c => {
            let pop = getInterpolatedValueSmooth(c, state.currentYear);
            let growth = getDerivativeValueSmooth(c, state.currentYear);
            
            c.popVal = pop; 
            c.growthVal = growth;
            
            if (state.metric === 'density') {
                c.targetValue = pop / c.area;
            } else if (state.metric === 'growth_abs') {
                c.targetValue = growth;
            } else {
                c.targetValue = pop;
            }
        });

        const sorted = [...currentData].sort((a, b) => b.targetValue - a.targetValue);

        currentData.forEach(c => {
            const rank = sorted.findIndex(item => item.name === c.name);
            c.targetRank = rank;
            c.targetY = rank < state.topN ? yScale(rank) : totalHeight + 100; 
            
            if (rank < state.topN) {
                if (state.metric === 'growth_abs') {
                    currentTotalPop += c.targetValue; 
                } else {
                    currentTotalPop += c.popVal;
                }
                currentTotalArea += c.area;
                
                if(!isInstant && c.prevRank !== undefined && c.targetRank < c.prevRank) {
                    playBeep(800 + Math.max(0, (50 - c.targetRank)) * 10);
                }
            }
            c.prevRank = c.targetRank;
        });

        if(state.metric === 'population') {
            document.getElementById("total-metric-label").innerText = "Суммарное население (Топ)";
            document.getElementById("total-pop-val").innerText = formatNumberDisplay(currentTotalPop).replace(/,/g, ' ');
        } else if (state.metric === 'growth_abs') {
            document.getElementById("total-metric-label").innerText = "Суммарный прирост (Топ)";
            let sign = currentTotalPop > 0 ? "+" : "";
            document.getElementById("total-pop-val").innerText = sign + formatNumberDisplay(currentTotalPop).replace(/,/g, ' ') + " чел / год";
        } else {
            document.getElementById("total-metric-label").innerText = "Средняя плотность (Топ)";
            let avgDens = currentTotalArea > 0 ? (currentTotalPop / currentTotalArea) : 0;
            document.getElementById("total-pop-val").innerText = formatNumberDisplay(avgDens).replace(/,/g, ' ') + " / км²";
        }

        if (sorted.length === 0) return;

        const topValue = sorted[0].targetValue;
        let maxXGoal = 0;

        if(!state.autoZoom) {
            if (state.metric === 'density') maxXGoal = globalMaxDensity * 1.05;
            else if (state.metric === 'growth_abs') maxXGoal = globalMaxGrowth * 1.05;
            else maxXGoal = globalMaxPop * 1.05;
        } else {
            maxXGoal = Math.max(topValue * 1.25, 1000); 
        }

        if (isInstant) currentMaxX = maxXGoal;
        else {
            const lerpFactorX = Math.min(1, 0.05 * (dt / 16));
            currentMaxX += (maxXGoal - currentMaxX) * lerpFactorX;
        }
        
        xScale.domain([0, currentMaxX]);
        
        const xAxis = d3.axisTop(xScale)
            .ticks(5)
            .tickFormat(d => {
                if(state.metric === 'density') return d.toFixed(0);
                
                let sign = (state.metric === 'growth_abs' && d > 0) ? "+" : "";
                let absD = Math.abs(d);
                
                if (absD >= 1000000000) return sign + (d / 1000000000).toFixed(1) + " млрд";
                if (absD >= 1000000) return sign + (d / 1000000).toFixed(1) + " млн";
                if (absD >= 1000) return sign + (d / 1000).toFixed(0) + " тыс";
                return sign + d;
            });
            
        axisSvg.select("#x-axis")
            .call(xAxis)
            .call(g => g.select(".domain").remove()) 
            .call(g => g.selectAll(".tick text").attr("fill", "#64748b").attr("dy", "-0.2em"));

        const xTicks = xScale.ticks(5);
        const gridLines = chartGroup.select("#grid-lines").selectAll("line").data(xTicks);
        
        gridLines.enter().append("line")
            .merge(gridLines)
            .attr("x1", d => xScale(d))
            .attr("x2", d => xScale(d))
            .attr("y1", 0)
            .attr("y2", totalHeight)
            .attr("stroke", "rgba(255,255,255,0.05)")
            .attr("stroke-dasharray", "4,4");
            
        gridLines.exit().remove();

        document.getElementById("year-bg-html").innerText = Math.floor(state.currentYear);

        const bars = chartGroup.selectAll(".bar-group").data(currentData, d => d.name);

        bars.each(function(d) {
            const group = d3.select(this);
            
            group.select(".bar-label").text(`${d.targetRank + 1}. ${d.flag} ${d.name}`);

            let targetOpacity = 1;
            if (d.targetRank >= state.topN) targetOpacity = 0; 
            else if (state.selectedBar && state.selectedBar !== d.name) targetOpacity = 0.25; 
            
            if (isInstant) {
                d.currentY = d.targetY;
                d.currentValue = d.targetValue;
                d.currentOpacity = targetOpacity;
            } else {
                const lerpFactorY = Math.min(1, 0.1 * (dt / 16)); 
                const lerpFactorV = Math.min(1, 0.2 * (dt / 16)); 
                const lerpFactorO = Math.min(1, 0.15 * (dt / 16)); 
                
                d.currentY += (d.targetY - d.currentY) * lerpFactorY;
                d.currentValue += (d.targetValue - d.currentValue) * lerpFactorV;
                d.currentOpacity += (targetOpacity - d.currentOpacity) * lerpFactorO;
            }

            const barWidth = Math.max(0, xScale(d.currentValue));

            group.attr("transform", `translate(0, ${d.currentY})`).attr("opacity", d.currentOpacity);
            
            group.select(".bar-rect")
                .attr("width", barWidth)
                .attr("stroke", state.selectedBar === d.name ? "#ffffff" : "none")
                .attr("stroke-width", state.selectedBar === d.name ? 2 : 0);
                
            group.select(".bar-value")
                .attr("x", barWidth + 10)
                .text(formatPop(d.currentValue));

            let diff = 0;
            if (state.currentYear > state.minYear) {
                if (state.metric === 'density') {
                    diff = d.growthVal / d.area; 
                } else if (state.metric === 'population') {
                    diff = d.growthVal; 
                }
            }
            
            const diffObj = formatDiff(diff);
            
            if (state.metric === 'growth_abs') {
                diffObj.text = ""; 
            }

            let popTextLen = formatPop(d.currentValue).length * 8 + 15;
            
            group.select(".trend-text")
                .attr("x", barWidth + 10 + popTextLen)
                .text(diffObj.text)
                .attr("fill", diffObj.color)
                .attr("opacity", d.currentOpacity > 0.5 ? 1 : 0);

            if (state.mode === 'countries' && d.area && state.metric === 'population') {
                let density = Math.round(d.popVal / d.area);
                let trendTextLen = (diffObj.text ? diffObj.text.length : 0) * 7 + 10;
                group.select(".density-text")
                    .attr("x", barWidth + 10 + popTextLen + trendTextLen)
                    .text(`| ${formatNumberDisplay(density).replace(/,/g, ' ')} чел/км²`)
                    .attr("opacity", 1);
            } else {
                group.select(".density-text").attr("opacity", 0);
            }
                
            group.style("pointer-events", d.currentOpacity < 0.1 ? "none" : "auto");
        });
    }

    /* =========================================
       ВИЗУАЛЬНЫЙ РЕДАКТОР (ТАБЛИЦА)

    function initTableEditor(data) {
        let isCountries = currentEditorMode === 'countries';
        const thead = document.getElementById("table-header-row");
        
        let yearsSet = new Set();
        data.forEach(c => Object.keys(c.data).forEach(y => {
            if (y !== "null" && !isNaN(y)) yearsSet.add(parseInt(y));
        }));
        allYearsKeys = Array.from(yearsSet).sort((a,b) => a - b);

        let html = `<th scope="col" class="px-4 py-3 sticky left-0 bg-slate-900 z-30 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)] border-b border-slate-700 min-w-[150px]">Название</th>
                    <th scope="col" class="px-2 py-3 text-center border-b border-slate-700">Флаг</th>
                    <th scope="col" class="px-2 py-3 text-center border-b border-slate-700">Цвет</th>`;
        if (isCountries) html += `<th scope="col" class="px-4 py-3 text-right min-w-[120px] border-b border-slate-700">Площадь (км²)</th>`;
        allYearsKeys.forEach(y => html += `<th scope="col" class="px-4 py-3 text-right min-w-[130px] border-b border-slate-700">${y}</th>`);
        html += `<th scope="col" class="px-4 py-3 text-center border-b border-slate-700">Удалить</th>`;
        thead.innerHTML = html;
        renderTableRows(data, isCountries);
    }

    function renderTableRows(data, isCountries) {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = '';
        data.forEach((item, index) => {
            const tr = document.createElement("tr");
            tr.className = "border-b border-slate-700 hover:bg-slate-800/50 transition-colors";
            
            let html = `
                <td class="px-4 py-2 sticky left-0 bg-slate-800 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">
                    <input type="text" class="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white focus:outline-none focus:border-blue-500 row-name" value="${item.name}">
                </td>
                <td class="px-2 py-2 text-center">
                    <input type="text" class="w-12 bg-slate-900 border border-slate-600 rounded px-1 py-1 text-center text-white focus:outline-none focus:border-blue-500 row-flag" value="${item.flag}">
                </td>
                <td class="px-2 py-2 text-center">
                    <div class="flex justify-center items-center">
                        <input type="color" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0 row-color p-0" value="${item.color}">
                    </div>
                </td>
            `;
            if (isCountries) {
                let areaVal = formatNumberSpaces(item.area || 1000);
                html += `<td class="px-4 py-2"><input type="text" inputmode="numeric" class="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-right text-blue-400 font-mono focus:outline-none focus:border-blue-500 pop-input row-area" value="${areaVal}"></td>`;
            }
            allYearsKeys.forEach(y => {
                let formattedVal = formatNumberSpaces(item.data[y] || 0);
                html += `<td class="px-4 py-2"><input type="text" inputmode="numeric" data-year="${y}" class="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-right text-green-400 font-mono focus:outline-none focus:border-blue-500 pop-input year-input" value="${formattedVal}"></td>`;
            });
            html += `<td class="px-4 py-2 text-center"><button class="text-slate-500 hover:text-red-500 transition-colors btn-delete-row" data-index="${index}" title="Удалить"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg></button></td>`;
            
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });

        // Выделение текста при клике
        document.querySelectorAll('#table-body input[type="text"]').forEach(input => {
            input.addEventListener('focus', function() {
                setTimeout(() => this.select(), 0);
            });
        });
        
        // Кнопки удаления
        document.querySelectorAll('.btn-delete-row').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = this.getAttribute('data-index');
                if (isCountries) {
                    rawWorkingCountries.splice(idx, 1);
                    renderTableRows(rawWorkingCountries, true);
                } else {
                    rawWorkingCities.splice(idx, 1);
                    renderTableRows(rawWorkingCities, false);
                }
            });
        });
    }

    function applyDataFromEditor() {
        try {
            let sourceData = currentEditorMode === 'countries' ? rawWorkingCountries : rawWorkingCities;
            let trs = document.querySelectorAll("#table-body tr");
            
            trs.forEach(tr => {
                let nameInput = tr.querySelector(".row-name");
                if(!nameInput) return; // заголовок или пустая
                let name = nameInput.value.trim();
                let flag = tr.querySelector(".row-flag").value;
                let color = tr.querySelector(".row-color").value;

                let item = sourceData.find(d => d.name === name && d.flag === flag);
                
                if (!item) {
                    item = { _id: Math.random().toString(36).substr(2, 9), data: {} };
                    sourceData.push(item);
                }

                item.flag = flag;
                item.name = name;
                item.color = color;
                
                if (currentEditorMode === 'countries') {
                    let areaInput = tr.querySelector(".row-area");
                    item.area = parseInt(areaInput.value.replace(/\s/g, ''), 10) || 1;
                } else {
                    item.area = 1000;
                }
                
                let inputs = tr.querySelectorAll(".year-input");
                inputs.forEach(inp => {
                    let y = inp.getAttribute("data-year");
                    let rawVal = parseInt(inp.value.replace(/\s/g, ''), 10) || 0;
                    item.data[y] = rawVal;
                });
            });

            loadData(sourceData);
            alert("Изменения сохранены и применены к графику!");
            
            if (currentEditorMode === 'countries') document.getElementById("tab-countries").click();
            else document.getElementById("tab-cities").click();
        } catch (err) {
            const errorMsg = document.getElementById("error-msg");
            errorMsg.innerText = "Ошибка при сохранении! Проверьте формат.";
            errorMsg.classList.remove("hidden");
            setTimeout(() => errorMsg.classList.add("hidden"), 3000);
        }
    }

    /* =========================================
       ОБРАБОТЧИКИ СОБЫТИЙ
       ========================================= */
    document.addEventListener("DOMContentLoaded", () => {
        const languageSelect=document.getElementById('language-select');
        languageSelect.innerHTML=LANGUAGES.map(([code,label])=>`<option value="${code}">${label}</option>`).join('');
        languageSelect.value=projectSettings.language;
        if(!projectSettings.name)setProjectName(SUBJECTS[projectSettings.subject][projectSettings.language]||SUBJECTS[projectSettings.subject].en);
        else setProjectName(projectSettings.name);
        applyInterfaceLanguage();
        languageSelect.addEventListener('change',()=>{projectSettings.language=languageSelect.value;setProjectName(projectSettings.name||SUBJECTS[projectSettings.subject][projectSettings.language]||SUBJECTS[projectSettings.subject].en);applyInterfaceLanguage();persistProjectSettings()});
        document.getElementById('project-name').addEventListener('input',e=>{projectSettings.name=e.target.value;applyInterfaceLanguage();persistProjectSettings()});
        const subjectSelect=document.getElementById('simulation-select');
        const subjectQuick=document.getElementById('subject-quick');
        subjectSelect.value=projectSettings.subject;
        subjectQuick.value=projectSettings.subject;
        document.getElementById('custom-metric').value=projectSettings.customMetric||'';
        document.getElementById('custom-metric-wrap').classList.toggle('hidden',projectSettings.subject!=='custom');
        document.getElementById('custom-metric').addEventListener('input',e=>{projectSettings.customMetric=e.target.value;persistProjectSettings();if(projectSettings.subject==='custom'&&e.target.value.trim()){setProjectName(e.target.value.trim());projectSettings.name=e.target.value.trim();applyInterfaceLanguage()}});
        function setSimulationSubject(subject){projectSettings.subject=subject;subjectSelect.value=subject;subjectQuick.value=subject;projectSettings.name='';setProjectName(subject==='custom'?(projectSettings.customMetric||'Custom simulation'):(SUBJECTS[subject][projectSettings.language]||SUBJECTS[subject].en));document.getElementById('custom-metric-wrap').classList.toggle('hidden',subject!=='custom');applyInterfaceLanguage();persistProjectSettings()}
        subjectSelect.addEventListener('change',()=>setSimulationSubject(subjectSelect.value));
        subjectQuick.addEventListener('change',()=>setSimulationSubject(subjectQuick.value));
        document.getElementById('metric-select').value=projectSettings.metric;
        document.getElementById('metric-select').addEventListener('change',e=>{projectSettings.metric=e.target.value;state.metric=e.target.value;persistProjectSettings();if(!state.isPlaying)renderFrame(true)});
        document.getElementById('simulation-select').value=projectSettings.subject;

        const btnPlay = document.getElementById("btn-play");
        const iconPlay = document.getElementById("icon-play");
        const iconPause = document.getElementById("icon-pause");
        const btnReset = document.getElementById("btn-reset");
        const speedBtns = document.querySelectorAll(".speed-btn");
        const slider = document.getElementById("year-slider");
        const filterSelect = document.getElementById("group-filter");
        
        const btnSettings = document.getElementById("btn-settings");
        const settingsPanel = document.getElementById("settings-panel");
        const metricSelect = document.getElementById("metric-select");
        const topNSelect = document.getElementById("top-n-select");
        const autoZoomToggle = document.getElementById("auto-zoom");
        const soundToggle = document.getElementById("sound-toggle");
        
        const tabCountries = document.getElementById("tab-countries");
        const tabCities = document.getElementById("tab-cities");
        const tabDataCountries = document.getElementById("tab-data-countries");
        const tabDataCities = document.getElementById("tab-data-cities");
        const viewViz = document.getElementById("view-viz");
        const viewData = document.getElementById("view-data");
        const timelineContainer = document.getElementById("timeline-container");
        const editorTitle = document.getElementById("editor-title");
        
        const btnApplyData = document.getElementById("btn-apply-data");
        const btnAddRow = document.getElementById("btn-add-row");
        const btnClearAll = document.getElementById("btn-clear-all");
        const btnSmoothData = document.getElementById("btn-smooth-data");
        const btnAdd10YearsEditor = document.getElementById("btn-add-10-years-editor");
        const extrapolateScenario = document.getElementById("extrapolate-scenario");

        // Форматирование при вводе с учетом позиции курсора
        document.getElementById('table-body').addEventListener('input', function(e) {
            if (e.target.classList.contains('pop-input')) {
                let input = e.target;
                let cursorPosition = input.selectionStart;
                let originalLength = input.value.length;
                
                // Оставляем только цифры
                let rawValue = input.value.replace(/\D/g, '');
                
                // Форматируем обратно с пробелами
                let formattedValue = formatNumberSpaces(rawValue);
                
                input.value = formattedValue;
                
                // Вычисляем, насколько сдвинулся курсор из-за добавления/удаления пробелов
                let newLength = input.value.length;
                let adjustment = newLength - originalLength;
                
                input.setSelectionRange(cursorPosition + adjustment, cursorPosition + adjustment);
            }
        });

        // Навигация с клавиатуры
        document.getElementById('table-body').addEventListener('keydown', (e) => {
            if (!e.target.classList.contains('pop-input') && !e.target.classList.contains('row-name') && !e.target.classList.contains('row-flag')) return;
            const currentInput = e.target;
            const currentTd = currentInput.closest('td');
            const currentTr = currentTd.closest('tr');
            const trs = Array.from(currentTr.parentElement.children);
            const tds = Array.from(currentTr.children);
            const tdIndex = tds.indexOf(currentTd);
            const trIndex = trs.indexOf(currentTr);

            let nextInput;

            if (e.key === "Enter" || e.key === "ArrowDown") {
                if (trIndex < trs.length - 1) nextInput = trs[trIndex + 1].children[tdIndex].querySelector('input');
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                if (trIndex > 0) nextInput = trs[trIndex - 1].children[tdIndex].querySelector('input');
                e.preventDefault();
            } else if (e.key === "ArrowRight") {
                if (currentInput.selectionEnd === currentInput.value.length) {
                    if (tdIndex < currentTr.children.length - 1) nextInput = currentTr.children[tdIndex + 1].querySelector('input');
                    e.preventDefault();
                }
            } else if (e.key === "ArrowLeft") {
                if (currentInput.selectionStart === 0) {
                    if (tdIndex > 0) nextInput = currentTr.children[tdIndex - 1].querySelector('input');
                    e.preventDefault();
                }
            }
            if (nextInput) nextInput.focus();
        });

        // Настройки UI
        btnSettings.addEventListener("click", () => {
            settingsPanel.classList.toggle("hidden");
        });
        document.addEventListener("click", (e) => {
            if(!btnSettings.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.add("hidden");
            }
        });

        metricSelect.addEventListener("change", (e) => {
            state.metric = e.target.value;
            if(!state.isPlaying) renderFrame(true);
        });

        topNSelect.addEventListener("change", (e) => {
            state.topN = parseInt(e.target.value);
            initD3();
            if(!state.isPlaying) renderFrame(true);
        });

        autoZoomToggle.addEventListener("change", (e) => {
            state.autoZoom = e.target.checked;
            if(!state.isPlaying) renderFrame(true);
        });

        soundToggle.addEventListener("change", (e) => {
            state.soundEnabled = e.target.checked;
            if(state.soundEnabled && !audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        });

        document.getElementById('install-app').addEventListener('click',async()=>{if(window.__installPrompt){window.__installPrompt.prompt();await window.__installPrompt.userChoice;window.__installPrompt=null;document.getElementById('install-app').style.display='none'}else alert('Для iPhone/iPad откройте меню «Поделиться» в Safari и выберите «На экран Домой». Для ПК и Android используйте меню браузера → «Установить приложение» или «Добавить на главный экран».')});

        function applyFilter() {
            let sourceData = state.mode === 'countries' ? rawWorkingCountries : rawWorkingCities;
            if (state.filterCategory !== "all") {
                sourceData = sourceData.filter(item => {
                    const tags = getTagsForItem(item.name, state.mode, item.flag);
                    return tags.includes(state.filterCategory);
                });
            }
            loadData(sourceData, true); 
        }

        filterSelect.addEventListener("change", (e) => {
            state.filterCategory = e.target.value;
            applyFilter();
            if (!state.isPlaying) renderFrame(true);
        });

        function switchTab(tabId) {
            [tabCountries, tabCities, tabDataCountries, tabDataCities].forEach(t => {
                t.classList.remove("active", "text-blue-500");
                t.classList.add("text-slate-400");
            });
            
            viewViz.classList.add("hidden");
            viewData.classList.add("hidden");
            timelineContainer.classList.add("hidden");

            if (tabId === 'countries') {
                tabCountries.classList.add("active");
                tabCountries.classList.remove("text-slate-400");
                viewViz.classList.remove("hidden");
                timelineContainer.classList.remove("hidden");
                state.mode = 'countries';
                applyFilter();
            } else if (tabId === 'cities') {
                tabCities.classList.add("active");
                tabCities.classList.remove("text-slate-400");
                viewViz.classList.remove("hidden");
                timelineContainer.classList.remove("hidden");
                state.mode = 'cities';
                applyFilter();
            } else if (tabId === 'data-countries') {
                tabDataCountries.classList.add("active");
                tabDataCountries.classList.remove("text-slate-400");
                viewData.classList.remove("hidden");
                editorTitle.innerText = "Редактор: Страны";
                currentEditorMode = 'countries';
                pauseAnimation();
                initTableEditor(rawWorkingCountries);
            } else if (tabId === 'data-cities') {
                tabDataCities.classList.add("active");
                tabDataCities.classList.remove("text-slate-400");
                viewData.classList.remove("hidden");
                editorTitle.innerText = "Редактор: Города";
                currentEditorMode = 'cities';
                pauseAnimation();
                initTableEditor(rawWorkingCities);
            }
        }

        tabCountries.addEventListener("click", () => switchTab('countries'));
        tabCities.addEventListener("click", () => switchTab('cities'));
        tabDataCountries.addEventListener("click", () => switchTab('data-countries'));
        tabDataCities.addEventListener("click", () => switchTab('data-cities'));

        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            if (state.isPlaying) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                iconPlay.classList.add("hidden");
                iconPause.classList.remove("hidden");
                btnPlay.classList.remove("bg-blue-600", "hover:bg-blue-500");
                btnPlay.classList.add("bg-amber-600", "hover:bg-amber-500");
                if (state.currentYear >= state.maxYear) state.currentYear = state.minYear;
                lastTime = performance.now();
                animationFrameId = requestAnimationFrame(gameLoop);
            } else {
                pauseAnimation();
            }
        }

        function pauseAnimation() {
            state.isPlaying = false;
            iconPlay.classList.remove("hidden");
            iconPause.classList.add("hidden");
            btnPlay.classList.add("bg-blue-600", "hover:bg-blue-500");
            btnPlay.classList.remove("bg-amber-600", "hover:bg-amber-500");
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        btnPlay.addEventListener("click", togglePlay);

        btnReset.addEventListener("click", () => {
            pauseAnimation();
            state.currentYear = state.minYear;
            slider.value = state.currentYear;
            renderFrame(true); 
        });

        slider.addEventListener("input", (e) => {
            pauseAnimation();
            state.currentYear = parseFloat(e.target.value);
            renderFrame(true);
        });

        speedBtns.forEach(btn => {
            btn.addEventListener("click", (e) => {
                speedBtns.forEach(b => {
                    b.classList.remove("bg-blue-600", "text-white");
                    b.classList.add("hover:bg-slate-700", "text-slate-300");
                });
                e.target.classList.add("bg-blue-600", "text-white");
                e.target.classList.remove("hover:bg-slate-700", "text-slate-300");
                state.msPerYear = parseInt(e.target.getAttribute("data-speed"));
            });
        });

        // Сглаживание данных
        btnSmoothData.addEventListener("click", () => {
            let activeData = currentEditorMode === 'countries' ? rawWorkingCountries : rawWorkingCities;
            if(allYearsKeys.length < 3) return;
            
            activeData.forEach(item => {
                let newVals = {};
                allYearsKeys.forEach((y, i) => {
                    if(i === 0 || i === allYearsKeys.length - 1) {
                        newVals[y] = item.data[y] || 0;
                    } else {
                        let prev = item.data[allYearsKeys[i-1]] || 0;
                        let curr = item.data[y] || 0;
                        let next = item.data[allYearsKeys[i+1]] || 0;
                        newVals[y] = Math.floor((prev + curr + next) / 3);
                    }
                });
                item.data = newVals;
            });
            initTableEditor(activeData);
            alert("Данные сглажены (заполнены провалы). Нажмите 'Применить', чтобы сохранить.");
        });

        // Добавление +10 лет через редактор со сценариями
        btnAdd10YearsEditor.addEventListener("click", () => {
            let activeData = currentEditorMode === 'countries' ? rawWorkingCountries : rawWorkingCities;
            let scenario = extrapolateScenario.value;
            
            if (allYearsKeys.length > 0) {
                let currentMax = allYearsKeys[allYearsKeys.length - 1];
                let prevYear = allYearsKeys.length > 1 ? allYearsKeys[allYearsKeys.length - 2] : currentMax - 10;
                let newYear = currentMax + 10;

                activeData.forEach(item => {
                    let valMax = item.data[currentMax] || 0;
                    let valPrev = item.data[prevYear] || valMax;

                    if (valMax === 0) {
                        item.data[newYear] = 0;
                        return;
                    }

                    let factor = valMax / valPrev;
                    
                    if(scenario === 'boom') factor = Math.max(factor, 1.15); // Бэби-бум
                    else if(scenario === 'stagnation') factor = 1.0; // Стагнация
                    else if(scenario === 'decline') factor = Math.min(factor, 0.95); // Спад
                    else {
                        // Тренд
                        factor = 1 + (factor - 1) * 0.95;
                        factor = Math.min(Math.max(factor, 0.8), 1.5);
                    }

                    item.data[newYear] = Math.floor(valMax * factor);
                });
                
                initTableEditor(activeData);
                
                // Скроллим вправо к новой колонке
                setTimeout(() => {
                    const scrollCont = document.getElementById("table-scroll-container");
                    if (scrollCont) scrollCont.scrollTo({ left: scrollCont.scrollWidth, behavior: 'smooth' });
                }, 100);
            }
        });

        btnApplyData.addEventListener("click", applyDataFromEditor);

        btnAddRow.addEventListener("click", () => {
            let isCountries = currentEditorMode === 'countries';
            let newRow = { 
                _id: Math.random().toString(36).substr(2, 9),
                name: isCountries ? "Новая страна" : "Новый город", 
                flag: "🏳️", 
                color: "#3b82f6", 
                data: {} 
            };
            if (isCountries) newRow.area = 100000;
            allYearsKeys.forEach(y => newRow.data[y] = 1000000);
            let arrToUpdate = isCountries ? rawWorkingCountries : rawWorkingCities;
            arrToUpdate.unshift(newRow); 
            renderTableRows(arrToUpdate, isCountries);
            document.getElementById("table-scroll-container").scrollTop = 0;
        });

        btnClearAll.addEventListener("click", () => {
            if(confirm("Вы уверены, что хотите обнулить ВСЕ значения в текущей таблице?")) {
                const popInputs = document.querySelectorAll('#table-body .pop-input');
                popInputs.forEach(input => {
                    input.value = "0"; 
                    input.classList.add("bg-red-900/40");
                    setTimeout(() => input.classList.remove("bg-red-900/40"), 200);
                });
            }
        });

        initD3();
        loadData(rawWorkingCountries, true);
    });

    window.addEventListener('resize', () => {
        const container = document.getElementById("chart-container");
        width = container.clientWidth;
        axisSvg.attr("width", "100%");
        svg.attr("width", "100%");
        xScale.range([0, width - margin.left - margin.right]);
        renderFrame(true); 
    });

</script>
<script>
    if ('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installPrompt=e;document.getElementById('install-app').style.display='inline-flex'});
    window.addEventListener('appinstalled',()=>document.getElementById('install-app').style.display='none');
</script>
</body>
</html>
